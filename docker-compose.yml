name: amneziawg-easy

services:
  awg-easy:
    build: .
    image: amneziawg-easy:local
    environment:
      VPN_PROTOCOL: amneziawg
      AWG_BACKEND: ${AWG_BACKEND:-userspace}
      AWG_FORCE_USERSPACE: "true"
      AWG_ISOLATED: "true"
      AWG_ROUTING_DEBUG: ${AWG_ROUTING_DEBUG:-false}
      DEBUG: ${AWG_DEBUG:-}
      # Optional backend integration credential: store only its SHA-256 digest.
      AWG_API_TOKEN_SHA256: ${AWG_API_TOKEN_SHA256:-}
      AWG_API_TOKEN_USER: ${AWG_API_TOKEN_USER:-}
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_IPV4_CIDR: 172.31.63.0/24
      INIT_IPV6_CIDR: fd31:63::/64
      TZ: Europe/Moscow
      # Set these in a private .env for unattended setup. Otherwise use the wizard.
      INIT_USERNAME: ${AWG_ADMIN_USERNAME:-}
      INIT_PASSWORD: ${AWG_ADMIN_PASSWORD:-}
      INIT_HOST: ${AWG_PUBLIC_IP:-}
      INIT_PORT: ${AWG_UDP_PORT:-38472}
    volumes:
      - awg_easy_data:/etc/wireguard
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${AWG_UDP_PORT:-38472}:${AWG_UDP_PORT:-38472}/udp"
      - "127.0.0.1:${AWG_UI_PORT:-28554}:51821/tcp"
    networks:
      - awg_easy
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      # TProxy marks select a local-delivery table; ignore them for reverse lookup.
      net.ipv4.conf.all.src_valid_mark: "0"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    cpus: 2
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

volumes:
  awg_easy_data:

networks:
  awg_easy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.63.0/24
